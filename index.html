<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0d12"><title>시지프 백화점 · 텍스트 로그</title>
<style>
:root{--bg:#0c0d12;--panel:#151722;--panel2:#1c2030;--line:#34394a;--gold:#cbaa61;--text:#e9e6de;--muted:#969baa;--blue:#80a9df;--red:#d78383;--green:#83b9a9;--violet:#bd9be8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.55}button{font:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.app{max-width:820px;margin:auto;padding:15px 13px 38px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{color:var(--gold);font-weight:900;letter-spacing:.1em;font-size:13px}.sub,small{color:var(--muted)}.sub{font-size:12px}.pill{border:1px solid var(--line);border-radius:99px;background:none;padding:7px 11px;font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-size:25px;font-weight:850;line-height:1.25;margin:4px 0 10px}.section{font-size:12px;color:var(--gold);font-weight:850;letter-spacing:.12em;margin:14px 0 7px}.story{white-space:pre-line;color:#b6bac6}.stats{display:flex;gap:6px 13px;flex-wrap:wrap;font-size:13px}.stats b{color:var(--text)}.bar{height:8px;background:#292e3b;border-radius:99px;overflow:hidden;margin:7px 0 11px}.bar i{display:block;height:100%;background:var(--gold)}.bar.hp i{background:var(--blue)}.bar.sp i{background:var(--violet)}.actions{display:grid;gap:9px;margin-top:14px}.choice{width:100%;text-align:left;background:var(--panel2);border:1px solid #3a4053;border-radius:11px;padding:13px}.choice strong{display:block}.choice small{display:block;margin-top:3px}.primary{background:var(--gold);color:#17130b;border:0;text-align:center;font-weight:850}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card,.unit{background:var(--panel2);border:1px solid #41475a;border-radius:11px;padding:12px;min-width:0}.card.selected{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.card h3,.unit h3{font-size:14px;margin:0 0 5px}.card p{font-size:12px;color:var(--muted);margin:4px 0 8px}.card button,.mini{width:100%;padding:9px;border:1px solid var(--line);background:#242a3a;border-radius:8px}.tag{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--gold);margin:1px 3px 1px 0}.tag.burn{color:#e59c71}.tag.bleed{color:#e18b9d}.tag.sink{color:#9da8ee}.tag.vibe{color:#83c5c2}.tag.breath{color:#d9c47d}.tag.charge{color:#c5a0ed}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.big{font-size:23px;font-weight:850}.log{font-size:12px;color:#c0c3cd;white-space:pre-line;max-height:240px;overflow:auto}.nodes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.node{padding:12px 5px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px}.node strong,.node small{display:block}.node strong{font-size:13px}.node small{font-size:11px}.foot{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.foot button{flex:1;min-width:90px}.dice-tray{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#10121b;border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}.die{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#d8bb79,#a98742);color:#17130b;font-size:23px;font-weight:950;box-shadow:0 3px 0 #70572b;transform:rotate(-4deg)}.die.rolling{animation:dieRoll .12s linear infinite}.die.enemy-die{background:linear-gradient(145deg,#b6c5df,#6b7f9f);box-shadow:0 3px 0 #46536a;color:#111725}.turn-banner{border:1px solid var(--gold);border-radius:9px;padding:9px 11px;margin:8px 0;background:#242116;font-weight:800;font-size:13px}.turn-banner.enemy-turn{border-color:#b46d77;background:#28191f;color:#f0b0b6}.battlefield.hit{animation:hitFlash .38s ease}.unit.hit{animation:unitHit .38s ease}.float-damage{position:absolute;color:#ff8888;font-weight:950;font-size:25px;pointer-events:none;animation:damageFloat .8s ease forwards}.unit{position:relative}.dice-label{font-size:12px;color:var(--muted)}@keyframes dieRoll{0%{transform:rotate(-8deg) scale(.96)}50%{transform:rotate(8deg) scale(1.08)}100%{transform:rotate(-8deg) scale(.96)}}@keyframes hitFlash{0%,100%{filter:none}25%{filter:brightness(1.8) sepia(.35) saturate(2)}50%{filter:brightness(.75)}}@keyframes unitHit{0%,100%{transform:translateX(0);border-color:#41475a}20%{transform:translateX(-5px);border-color:#ef7373;box-shadow:0 0 18px #ed686855}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}@keyframes damageFloat{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-28px) scale(1.1)}}.notice{border-left:3px solid var(--gold);padding:8px 11px;background:#201e1a;border-radius:4px;font-size:12px;color:#d5c8a7}.keywords{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:5}.modal>div{max-width:460px;width:100%;max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.modal button{width:100%;padding:11px;margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}.hide{display:none!important}@media(max-width:430px){.grid{grid-template-columns:1fr}.nodes{grid-template-columns:repeat(2,1fr)}.title{font-size:22px}.panel{padding:13px}}@media(min-width:650px){.app{padding-top:24px}.panel{padding:19px}}
</style></head><body><div class="app">
<header class="top"><div><div class="brand">SIZIF DEPARTMENT STORE</div><div class="sub">시지프 백화점 · 시즌 로그 v0.4</div></div><button class="pill" onclick="resetAsk()">기록 초기화</button></header>
<section class="panel" id="status"></section><section class="panel" id="main"></section><section class="panel" id="lower"></section>
<p class="sub" style="text-align:center">진행 상황은 이 기기에 자동 저장됩니다.</p></div><div id="modal" class="modal hide"><div id="modalbody"></div></div>
<script>
const $=s=>document.querySelector(s);
const CARDS=[
{id:'slash',name:'가르기',type:'공격',cost:1,power:3,dice:'1d6',desc:'위력 3 + 공격 주사위',effects:[]},
{id:'heavy',name:'내려치기',type:'공격',cost:2,power:5,dice:'1d8',desc:'위력 5 + 공격 주사위',effects:[]},
{id:'evade',name:'회피',type:'회피',cost:1,power:0,dice:'1d6',desc:'적 공격 주사위와 같으면 공격 무효',effects:[]},
{id:'breath',name:'호흡 베기',type:'공격·호흡',cost:1,power:2,dice:'1d6',desc:'호흡 2 획득 후 공격',effects:[['호흡',2]]},
{id:'vibration',name:'진동 타격',type:'공격·진동',cost:1,power:2,dice:'1d6',desc:'진동 3 부여',effects:[['진동',3]]},
{id:'sink',name:'침잠의 칼날',type:'공격·침잠',cost:1,power:2,dice:'1d6',desc:'침잠 2 부여',effects:[['침잠',2]]},
{id:'bleed',name:'녹슨 칼날',type:'공격·출혈',cost:1,power:2,dice:'1d4',desc:'출혈 2 부여',effects:[['출혈',2]]},
{id:'burn',name:'잔불',type:'공격·화상',cost:1,power:2,dice:'1d4',desc:'화상 2 부여',effects:[['화상',2]]},
{id:'charge',name:'축전',type:'지원·충전',cost:1,power:0,dice:'—',desc:'충전 3 획득',effects:[['충전',3]]},
{id:'charged',name:'방전 일격',type:'충전 소비',cost:1,power:2,dice:'1d6',desc:'충전 1 이상 소모 시 위력 + 충전 소모량',effects:[],chargeUse:1},
{id:'breathHeal',name:'호흡 정돈',type:'지원',cost:1,power:0,dice:'—',desc:'정신력 5 회복',effects:[['정신력',5]]}
];
// No canonical enemies are loaded yet. This single dummy exists only to test combat.
const TEST_ENEMY={name:'미등록 적 (시험용)',maxHp:34,attackPower:2,dice:'1d6',desc:'전투 규칙 확인용 임시 표적. 실제 적은 아직 등록하지 않았다.'};
const fresh=()=>({floor:1,season:1,turn:1,seasonLength:5,hp:74,maxHp:74,sp:45,maxSp:45,asset:30,level:1,xp:0,deck:['slash','slash','heavy','evade','bleed','breath','vibration','sink','burn','charge','charged'],phase:'intro',seasonLog:[],event:null,enemy:null,enemyHp:0,enemyStatus:{vibration:0,breath:0,sink:0,bleed:0,burn:0,charge:0},playerStatus:{vibration:0,breath:0,sink:0,bleed:0,burn:0,charge:0},hand:[],selected:[],energy:3,round:1,playerEvade:[],summary:[],log:[],lastEvent:null,reward:null,routeDone:0});
let S;try{S=JSON.parse(localStorage.getItem('sizifSaveV04'))||fresh()}catch(e){S=fresh()}
function save(){localStorage.setItem('sizifSaveV04',JSON.stringify(S))}
function rand(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function roll(spec){if(!spec||spec==='—')return 0;const m=spec.match(/(\d+)d(\d+)/);if(!m)return 0;let v=0;for(let i=0;i<+m[1];i++)v+=1+rand(+m[2]);return v}
function card(id){return CARDS.find(c=>c.id===id)}
function hpbar(v,m,cl=''){return `<div class="bar ${cl}"><i style="width:${Math.max(0,Math.min(100,v/m*100))}%"></i></div>`}
function kw(name,val){if(!val)return '';let cls={진동:'vibe',호흡:'breath',침잠:'sink',출혈:'bleed',화상:'burn',충전:'charge'}[name]||'';return `<span class="tag ${cls}">${name} ${val}</span>`}
function statusHTML(){let ps=S.playerStatus||{};return `<div class="head"><div><div style="font-size:19px;font-weight:850"><span style="color:var(--blue)">■</span> 당신 <span class="sub">무명</span></div><div class="sub">상징계 · ${S.floor}층 · 시즌 ${S.season}/5 · ${S.turn}/${S.seasonLength}턴</div></div><span class="pill">Lv.${S.level} · EXP ${S.xp}/4</span></div><div class="section">생존 상태</div><div class="stats"><span>체력 <b>${S.hp}/${S.maxHp}</b></span><span>정신력 <b>${S.sp}/${S.maxSp}</b></span><span>자산 <b>${S.asset}만</b></span></div>${hpbar(S.hp,S.maxHp,'hp')}${hpbar(S.sp,S.maxSp,'sp')}<div class="keywords">${[['진동','vibration'],['호흡','breath'],['침잠','sink'],['출혈','bleed'],['화상','burn'],['충전','charge']].map(([label,key])=>kw(label,ps[key]||0)).join('')||'<span class="sub">보유 키워드 없음</span>'}</div><div class="foot"><button class="mini" onclick="showDeck()">카드 / 덱</button><button class="mini" onclick="showRules()">키워드 규칙</button><button class="mini" onclick="showRecord()">기록</button></div>`}
function render(){if(!S.playerStatus)S.playerStatus={vibration:0,breath:0,sink:0,bleed:0,burn:0,charge:0};if(!S.enemyStatus)S.enemyStatus={vibration:0,breath:0,sink:0,bleed:0,burn:0,charge:0};$('#status').innerHTML=statusHTML();const m=$('#main'),l=$('#lower');l.classList.remove('hide');
if(S.phase==='intro'){m.innerHTML=`<div class="section">탐색 기록 · 시작</div><div class="title">백화점은 아직 영업 중이다</div><div class="story">복도에 조명이 켜진다. 어디선가 안내 방송이 흘러나오지만, 내용은 알아들을 수 없다.\n\n이 탐색은 최대 5개 시즌으로 구성된다. 각 시즌은 5~7턴 동안 이어지며, 시즌을 모두 마쳐야 다음 층으로 이동할 수 있다. 사건은 무작위로 발생한다.</div><div class="actions"><button class="choice primary" onclick="startRun()">탐색 시작</button><button class="choice" onclick="showRules()">전투 및 키워드 규칙</button></div>`;l.innerHTML=''}
else if(S.phase==='season'){const ev=S.event;m.innerHTML=`<div class="section">${S.floor}층 · 시즌 ${S.season}/5 · ${S.turn}턴</div><div class="title">${ev.title}</div><div class="story">${ev.text}</div><div class="notice" style="margin-top:12px">사건은 무작위로 발생한다. 아래 행동을 실행하면 턴이 진행된다.</div><div class="actions">${ev.actions.map((a,i)=>`<button class="choice" onclick="act(${i})"><strong>${a.name}</strong><small>${a.desc}</small></button>`).join('')}</div><button class="choice" style="margin-top:9px" onclick="beginCombat()"><strong>테스트 전투 호출</strong><small>개발 확인용 · 언제든 임시 적과 전투</small></button>`;l.innerHTML=`<div class="section">이번 시즌 기록</div><div class="log">${S.seasonLog.slice(-8).map(x=>'• '+x).join('\n')||'아직 기록이 없습니다.'}</div><div class="sub">시즌은 ${S.seasonLength}턴으로 설정됨. 시즌 종료 후 다음 시즌으로 넘어갑니다.</div>`}
else if(S.phase==='combat')combatUI(m,l);
else if(S.phase==='reward'){m.innerHTML=`<div class="section">전투 종료 · 보상</div><div class="title">${S.reward.title}</div><div class="story">${S.reward.text}</div><div class="actions"><button class="choice primary" onclick="continueAfterFight()">계속 진행한다</button></div>`;l.innerHTML=`<div class="section">전투 요약</div><div class="log">${S.summary.join('\n')}</div>`}
else if(S.phase==='floor'){m.innerHTML=`<div class="section">층 이동</div><div class="title">${S.floor}층 탐색 완료</div><div class="story">다섯 시즌을 모두 통과했다. 복도 끝에 다음 층으로 향하는 문이 열린다.</div><div class="actions"><button class="choice primary" onclick="nextFloor()">다음 층으로 이동</button></div>`;l.innerHTML=`<div class="section">층 기록</div><div class="log">${S.seasonLog.slice(-12).map(x=>'• '+x).join('\n')}</div>`}
else if(S.phase==='dead'){m.innerHTML=`<div class="section">탐색 종료</div><div class="title">의식이 끊긴다</div><div class="story">이번 탐색은 여기까지다. 기록을 남기고 다시 시작할 수 있다.</div><div class="actions"><button class="choice primary" onclick="newRun()">새 탐색 시작</button></div>`;l.innerHTML=''}
else if(S.phase==='clear'){m.innerHTML=`<div class="section">프로토타입 완료</div><div class="title">더 깊은 층으로</div><div class="story">이번 버전에서 준비된 층을 모두 통과했다.</div><div class="actions"><button class="choice primary" onclick="newRun()">새 탐색 시작</button></div>`;l.innerHTML=''}
save()}
const EVENTS=[
{title:'고장 난 배달 기계',text:'낡은 배달 기계가 복도를 막고 있다. 내부에서 불규칙한 진동이 느껴진다.',actions:[{name:'기계를 밀어낸다',desc:'체력을 소모할 수 있지만 자산을 얻는다.',fn:()=>{if(Math.random()<.65){S.asset+=8;return '기계를 옮기고 자산 8만을 얻었다.'}S.hp=Math.max(0,S.hp-5);return '기계가 갑자기 움직였다. 체력 5를 잃었다.'}},{name:'배선에 손을 댄다',desc:'충전을 얻는다.',fn:()=>{S.playerStatus.charge+=2;return '배선에서 에너지를 흡수했다. 충전 +2.'}}]},
{title:'향수 매장의 잔향',text:'매장 안에 달콤한 향이 남아 있다. 오래 맡으면 정신이 흐려질 것 같다.',actions:[{name:'향을 들이마신다',desc:'정신력을 회복한다.',fn:()=>{S.sp=Math.min(S.maxSp,S.sp+6);return '정신력이 6 회복됐다.'}},{name:'병을 챙긴다',desc:'전리품 대신 자산을 얻는다.',fn:()=>{S.asset+=5;return '향수 병을 팔아 자산 5만을 얻었다.'}}]},
{title:'핏자국이 남은 통로',text:'바닥에 말라붙은 핏자국이 이어진다. 벽 안쪽에서 긁는 소리가 들린다.',actions:[{name:'흔적을 조사한다',desc:'출혈 키워드를 얻지만 체력을 잃을 수 있다.',fn:()=>{S.playerStatus.bleed+=2;S.hp=Math.max(1,S.hp-2);return '흔적에서 날카로운 파편을 얻었다. 출혈 +2, 체력 2 감소.'}},{name:'빠르게 지나간다',desc:'아무 일 없이 지나갈 가능성이 높다.',fn:()=>{if(Math.random()<.25){S.sp=Math.max(0,S.sp-3);return '이상한 소리에 정신력이 3 감소했다.'}return '아무 일도 일어나지 않았다.'}}]},
{title:'흔들리는 진열장',text:'진열장 안의 물건들이 같은 박자로 떨린다. 진동이 유리 표면을 타고 퍼진다.',actions:[{name:'진동을 따라 호흡한다',desc:'호흡을 얻는다.',fn:()=>{S.playerStatus.breath+=2;return '호흡 +2. 다음 공격의 치명타 확률이 상승한다.'}},{name:'유리를 두드린다',desc:'진동을 얻는다.',fn:()=>{S.playerStatus.vibration+=3;return '진동 +3. 진동 폭발을 일으킬 때 추가 피해를 준다.'}}]},
{title:'검은 안개',text:'바닥에 검은 안개가 고인다. 안개 속에 서 있자 상대의 움직임이 둔해지는 상상이 든다.',actions:[{name:'안개를 모은다',desc:'침잠을 얻는다.',fn:()=>{S.playerStatus.sink+=2;return '침잠 +2. 대상의 공격 주사위 최종 위력이 감소한다.'}},{name:'안개를 피해 돌아간다',desc:'체력을 조금 회복한다.',fn:()=>{S.hp=Math.min(S.maxHp,S.hp+4);return '체력 4를 회복했다.'}}]},
{title:'불씨가 남은 작업대',text:'작업대 위에서 작은 불씨가 타오른다. 금속 도구가 붉게 달아올라 있다.',actions:[{name:'불씨를 옮긴다',desc:'화상을 얻는다.',fn:()=>{S.playerStatus.burn+=2;return '화상 +2. 턴 종료마다 화상 수치만큼 피해를 준다.'}},{name:'금속을 챙긴다',desc:'자산을 얻는다.',fn:()=>{S.asset+=6;return '금속을 팔아 자산 6만을 얻었다.'}}]},
{title:'비어 있는 휴게실',text:'휴게실에는 아무도 없지만 따뜻한 차가 한 잔 놓여 있다.',actions:[{name:'차를 마신다',desc:'체력과 정신력을 조금 회복한다.',fn:()=>{S.hp=Math.min(S.maxHp,S.hp+5);S.sp=Math.min(S.maxSp,S.sp+4);return '체력 5, 정신력 4를 회복했다.'}},{name:'곧장 떠난다',desc:'아무 효과 없이 다음 턴으로 진행한다.',fn:()=> '휴게실을 지나쳤다.'}]}
];
function startRun(){S=fresh();S.phase='season';startSeason();render()}
function newRun(){S=fresh();S.phase='season';startSeason();render()}
function startSeason(){S.turn=1;S.seasonLength=5+rand(3);S.event=makeCombatEvent(true);S.seasonLog.push(`층 ${S.floor} · 시즌 ${S.season} 시작 (${S.seasonLength}턴)`)}
function makeCombatEvent(seasonStart=false){return {title:seasonStart?'시즌 개시 전투':'그림자계의 기척',text:seasonStart?'새 시즌이 시작되자 복도 끝에서 적의 그림자가 모습을 드러낸다. 전투를 마쳐야 탐색을 계속할 수 있다.':'주변의 소음이 멎는다. 가까운 곳에 적이 있다. 전투를 치르고 다음 사건으로 나아갈 수 있다.',combat:true,seasonStart,actions:[{name:'전투에 돌입한다',desc:'임시 테스트 적과 전투한다. 카드와 주사위 시스템을 시험할 수 있다.'}]}}
function makeEvent(){if(Math.random()<0.28)return makeCombatEvent(false);const base=EVENTS[rand(EVENTS.length)];return {title:base.title,text:base.text,actions:base.actions.map(a=>({name:a.name,desc:a.desc,fnIndex:EVENTS.indexOf(base)})),source:base}}
function act(i){if(S.phase!=='season'||!S.event)return;if(S.event.combat){S.seasonLog.push(`시즌 ${S.season} · ${S.turn}턴 — ${S.event.title}: 전투 진입`);beginCombat();return}const a=S.event.source.actions[i];if(!a)return;const result=a.fn();S.seasonLog.push(`시즌 ${S.season} · ${S.turn}턴 — ${S.event.title}: ${a.name}. ${result}`);if(S.hp<=0){S.phase='dead';render();return}S.turn++;if(S.turn>S.seasonLength){S.season++;if(S.season>5){S.phase='floor';render();return}startSeason()}else S.event=makeEvent();render()}
function nextFloor(){S.floor++;S.season=1;S.seasonLog.push(`— ${S.floor}층 진입 —`);S.phase='season';startSeason();render()}
function beginCombat(){S.enemy={...TEST_ENEMY};S.enemyHp=S.enemy.maxHp;S.enemyStatus={vibration:0,breath:0,sink:0,bleed:0,burn:0,charge:0};S.playerStatus=S.playerStatus||{vibration:0,breath:0,sink:0,bleed:0,burn:0,charge:0};S.round=1;S.summary=[];S.rollFace=1;S.enemyRollFace=1;S.isRolling=false;S.isResolving=false;S.hitSide='';S.activeTurn='player';S.log=[`${S.enemy.name}와 조우했다. ${S.enemy.desc}`];drawHand();S.phase='combat';render()}
function drawHand(){S.hand=shuffle(S.deck).slice(0,Math.min(5,S.deck.length)).map(card);S.selected=[];S.energy=3;S.playerEvade=[]}
function combatUI(m,l){const e=S.enemy,ps=S.playerStatus,es=S.enemyStatus;m.innerHTML=`<div class="section">시험 전투 · ${S.round}라운드</div><div class="two battlefield ${S.hitSide?'hit':''}"><div class="unit ${S.hitSide==='enemy'?'hit':''}"><h3 style="color:var(--red)">■ ${e.name}</h3><div class="big">${S.enemyHp}<span class="sub"> / ${e.maxHp}</span></div>${hpbar(S.enemyHp,e.maxHp)}<div class="sub">공격 위력 ${Math.max(0,e.attackPower-(es.sink||0))} · 공격 주사위 ${e.dice}</div><div class="keywords">${kw('진동',es.vibration)}${kw('침잠',es.sink)}${kw('출혈',es.bleed)}${kw('화상',es.burn)}</div></div><div class="unit ${S.hitSide==='player'?'hit':''}"><h3 style="color:var(--blue)">■ 당신</h3><div class="big">${S.hp}<span class="sub"> / ${S.maxHp}</span></div>${hpbar(S.hp,S.maxHp,'hp')}<div class="sub">정신력 ${S.sp}/${S.maxSp} · 빛 ${S.energy}</div><div class="keywords">${[['진동','vibration'],['호흡','breath'],['침잠','sink'],['출혈','bleed'],['화상','burn'],['충전','charge']].map(([label,key])=>kw(label,ps[key]||0)).join('')}</div></div></div><div class="dice-tray"><div><div class="dice-label">내 공격 / 회피 주사위</div><div class="die ${S.isRolling?'rolling':''}" id="dieFace">${S.isRolling?'⚄':(S.rollFace||1)}</div></div><div><div class="dice-label">상대 회피 / 공격 주사위</div><div class="die enemy-die ${S.isRolling?'rolling':''}" id="enemyDieFace">${S.isRolling?'⚄':(S.enemyRollFace||1)}</div></div><div style="flex:1;min-width:110px"><strong>${S.isRolling?'주사위 굴리는 중…':(S.activeTurn==='player'?'플레이어 턴':'적 턴')}</strong><div class="dice-label">${S.rollCaption||'카드를 한 장 선택하세요.'}</div></div></div><div class="notice" style="margin:10px 0">내 턴에는 공격 주사위와 적 회피 주사위를 비교하고, 적 턴에는 적 공격 주사위와 내 회피 주사위를 비교합니다. 적은 상황에 따라 공격 카드를 선택하며 양쪽 판정 모두 주사위 애니메이션을 표시합니다.</div><div class="grid">${S.hand.map((c,i)=>`<div class="card ${S.selected.includes(i)?'selected':''}"><h3>${c.name}</h3><p><span class="tag">${c.type}</span> 비용 ${c.cost}</p><p>${c.desc}</p>${c.dice!=='—'?`<p class="gold">위력 ${c.power} · ${c.dice}</p>`:''}<button onclick="toggleCard(${i})" ${S.isResolving||S.isRolling?'disabled':(c.cost>S.energy&&!S.selected.includes(i)?'disabled':'')}>${S.selected.includes(i)?'선택 해제':'선택하기'}</button></div>`).join('')}</div><div class="actions"><button class="choice primary" onclick="resolveTurn()" ${S.selected.length&&!S.isResolving&&!S.isRolling?'':'disabled'}>카드 사용</button><button class="choice" onclick="leaveTestCombat()" ${S.isResolving||S.isRolling?'disabled':''}>시험 전투 종료</button></div>`;
l.innerHTML=`<div class="section">전투 요약</div><div class="log">${S.summary.slice(-18).join('\n')||'아직 전투 기록이 없습니다.'}</div><div class="section">전투 로그</div><div class="log">${S.log.slice(-10).map(x=>'• '+x).join('\n')}</div>`}
function toggleCard(i){const c=S.hand[i];if(!c)return;if(S.selected.includes(i))S.selected=S.selected.filter(n=>n!==i);else if(!S.selected.length&&c.cost<=3)S.selected.push(i);render()}
function addKeyword(target,key,n){target[key]=(target[key]||0)+n}
function tickBleed(target,owner,label){if((target.bleed||0)>0){const d=target.bleed; if(owner==='player')S.hp=Math.max(0,S.hp-d);else S.enemyHp=Math.max(0,S.enemyHp-d);target.bleed=Math.max(0,target.bleed-1);S.summary.push(`${label} 출혈: 피해 ${d}, 출혈 ${target.bleed}`)}}
function tickBurn(target,owner,label){if((target.burn||0)>0){const d=target.burn;if(owner==='player')S.hp=Math.max(0,S.hp-d);else S.enemyHp=Math.max(0,S.enemyHp-d);target.burn=Math.max(0,target.burn-1);S.summary.push(`${label} 화상: 피해 ${d}, 화상 ${target.burn}`)}}
function animateDice(mode,done){
  S.isRolling=true;S.rollMode=mode;S.rollCaption=mode==='player'?'내 공격 주사위와 적 회피 주사위를 굴립니다.':'적 공격 주사위와 내 회피 주사위를 굴립니다.';render();let ticks=0;
  const timer=setInterval(()=>{S.rollFace=1+rand(6);S.enemyRollFace=1+rand(6);const die=document.querySelector('#dieFace');const edie=document.querySelector('#enemyDieFace');if(die)die.textContent=String(S.rollFace);if(edie)edie.textContent=String(S.enemyRollFace);ticks++;if(ticks>=9){clearInterval(timer);S.isRolling=false;done()}},65)
}
function resolveTurn(){if(!S.selected.length||S.isRolling||S.isResolving)return;S.isResolving=true;animateDice('player',resolveTurnNow)}
function resolveTurnNow(){
 const hpBefore=S.hp,enemyBefore=S.enemyHp,cards=S.selected.map(i=>S.hand[i]),c=cards[0];if(!c)return;const lines=[];
 // Player attacks: player's attack die is compared with the enemy's evasion die.
 if(c.id==='evade'){
   lines.push(`당신은 회피 자세를 취했다. (이번 턴의 공격 행동은 하지 않음)`);
 }else if(c.dice!=='—'){
   const die=roll(c.dice),enemyEvade=roll('1d6');S.rollFace=die;S.enemyRollFace=enemyEvade;let power=c.power||0;
   if(c.id==='charged'){let spent=Math.min(3,S.playerStatus.charge||0);S.playerStatus.charge-=spent;power+=spent;lines.push(`${c.name}: 충전 ${spent} 소모`)}
   let damage=power+die;const breath=S.playerStatus.breath||0;let crit=false;if(breath>0&&Math.random()*100<Math.min(100,breath*5)){crit=true;damage*=2;S.playerStatus.breath=Math.max(0,breath-1)}
   if(die===enemyEvade){damage=0;lines.push(`${c.name}: 내 공격 ${die} = 적 회피 ${enemyEvade} · 회피 성공, 피해 0`)}else{S.enemyHp=Math.max(0,S.enemyHp-damage);lines.push(`${c.name}: 위력 ${power} + 공격 주사위 ${die} vs 적 회피 ${enemyEvade}${crit?' · 호흡 치명타!':''} = 피해 ${damage}`)}
 }
 for(const [key,n] of c.effects||[]){if(key==='정신력'){S.sp=Math.min(S.maxSp,S.sp+n);lines.push(`${c.name}: 정신력 +${n}`)}else{const map={'진동':'vibration','호흡':'breath','침잠':'sink','출혈':'bleed','화상':'burn','충전':'charge'};const k=map[key]||key;const target=['vibration','sink','bleed','burn'].includes(k)?S.enemyStatus:S.playerStatus;addKeyword(target,k,n);lines.push(`${['vibration','sink','bleed','burn'].includes(k)?'적에게':'자신에게'} 키워드 부여: ${key} +${n}`)}}
 tickBleed(S.enemyStatus,'enemy','적');if((S.enemyStatus.vibration||0)>=6){const burst=Math.floor(S.enemyStatus.vibration/6),bonus=burst*6;S.enemyStatus.vibration%=6;S.enemyHp=Math.max(0,S.enemyHp-bonus);lines.push(`진동 폭발: 추가 피해 ${bonus}, 남은 진동 ${S.enemyStatus.vibration}`)}
 S.summary.push(`【${S.round}라운드 · 플레이어 턴】`,...lines);S.log.push(...lines);S.energy=3;S.selected=[];
 S.rollCaption='플레이어 행동 결과';S.activeTurn='player-result';S.hitSide=S.enemyHp<enemyBefore?'enemy':'';render();
 if(S.enemyHp<=0){setTimeout(()=>{if(S.phase==='combat'){S.hitSide='enemy';S.rollCaption='적 격파!';render();combatWin()}},1150);return}
 // 결과를 읽을 시간을 준 뒤 적 AI가 행동한다.
 setTimeout(()=>{if(S.phase!=='combat')return;const ai=chooseEnemyAction();S.enemyAction=ai;S.activeTurn='enemy';animateDice('enemy',()=>resolveEnemyTurn(ai,hpBefore,enemyBefore))},1350);
}
function chooseEnemyAction(){const hpRate=S.enemyHp/Math.max(1,S.enemy.maxHp);const heavy=hpRate<0.35&&Math.random()<0.65;return heavy?{name:'필사의 강공',power:S.enemy.attackPower+2,dice:S.enemy.dice,kind:'heavy'}:{name:'기본 공격',power:S.enemy.attackPower,dice:S.enemy.dice,kind:'normal'}}
function resolveEnemyTurn(ai,hpBefore,enemyBefore){
 const enemyDie=roll(ai.dice||'1d6'),playerEvade=roll('1d6');S.enemyRollFace=enemyDie;S.rollFace=playerEvade;const dodged=playerEvade===enemyDie;const attackPower=Math.max(0,ai.power-(S.playerStatus.sink||0));
 if(dodged){S.summary.push(`【적 턴 · ${ai.name}】 적 공격 주사위 ${enemyDie} = 내 회피 주사위 ${playerEvade} · 회피 성공, 공격 무효`)}else{const dmg=Math.max(0,attackPower+enemyDie);S.hp=Math.max(0,S.hp-dmg);S.summary.push(`【적 턴 · ${ai.name}】 위력 ${attackPower} + 적 공격 주사위 ${enemyDie} vs 내 회피 ${playerEvade} = 받은 피해 ${dmg}`)}
 tickBleed(S.playerStatus,'player','플레이어');tickBurn(S.playerStatus,'player','플레이어');tickBurn(S.enemyStatus,'enemy','적');
 if(S.hp<=0){S.hitSide='player';S.rollCaption='피격!';render();setTimeout(()=>{if(S.phase==='combat'){S.phase='dead';render()}},1100);return}if(S.enemyHp<=0){S.hitSide='enemy';S.rollCaption='적 격파! 결과를 확인하세요.';render();setTimeout(()=>{if(S.phase==='combat')combatWin()},1100);return}
 S.hitSide=S.hp<hpBefore?'player':(S.enemyHp<enemyBefore?'enemy':'');S.rollCaption=dodged?'적 턴 결과: 회피 판정 성공!':(S.hitSide==='player'?'적 턴 결과: 공격 명중':'적 턴 결과: 행동 완료');S.activeTurn='enemy-result';render();
 // 피해와 키워드 변화를 확인할 수 있도록 결과 화면을 잠시 유지한다.
 setTimeout(()=>{if(S.phase!=='combat')return;S.isResolving=false;S.activeTurn='player';S.round++;drawHand();render();if(S.hitSide){const side=S.hitSide;setTimeout(()=>{if(S.phase==='combat'&&S.hitSide===side){S.hitSide='';render()}},420)}},1350)
}
function combatWin(){S.asset+=8;S.xp++;if(S.xp>=4){S.xp-=4;S.level++;S.maxHp+=5;S.hp=Math.min(S.maxHp,S.hp+8);S.maxSp+=2;S.sp=Math.min(S.maxSp,S.sp+2)}S.reward={title:'시험 전투 종료',text:'임시 전투에서 승리했다. 자산 8만과 경험치 1을 얻었다.'};S.phase='reward';S.summary.push('전투 종료: 승리')}
function continueAfterFight(){S.phase='season';if(S.event&&S.event.combat){S.turn++;if(S.turn>S.seasonLength){S.season++;if(S.season>5){S.phase='floor';render();return}startSeason();render();return}}S.event=makeEvent();render()}
function leaveTestCombat(){S.phase='season';if(S.event&&S.event.combat){S.turn++;if(S.turn>S.seasonLength){S.season++;if(S.season>5){S.phase='floor';render();return}startSeason();render();return}}S.event=makeEvent();render()}
function showRules(){modal('키워드 규칙',`<p><b>진동</b> — 진동 폭발이 발생할 때 추가 피해를 줍니다. 현재 프로토타입에서는 적 진동 6마다 추가 피해 6을 주고 6을 소모합니다.</p><p><b>호흡</b> — 수치 1당 치명타 확률 5%. 치명타는 현재 2배 피해로 시험 적용되며, 치명타 발생 시 호흡 1을 소모합니다.</p><p><b>침잠</b> — 수치 1당 상대 주사위 최종 위력 -1. 현재 플레이어 침잠은 적의 공격 위력을 낮추는 방식으로 시험 적용됩니다.</p><p><b>출혈</b> — 대상이 공격을 처리할 때 출혈 수치만큼 피해를 받고 출혈이 1 감소합니다.</p><p><b>화상</b> — 양쪽 턴 종료 시 수치만큼 피해를 받고 화상이 1 감소합니다.</p><p><b>충전</b> — 특정 스킬에서 소모해 강화합니다. 방전 일격은 충전을 최대 3 소모해 위력을 올립니다.</p><p class="sub">일부 키워드는 현재 시험용 단순 규칙입니다. 정확한 발동 타이밍은 이후 함께 조정할 수 있습니다.</p>`)}
function showDeck(){modal('카드 / 덱',S.deck.map((id,i)=>{const c=card(id);return `<p><b>${i+1}. ${c.name}</b> <span class="sub">비용 ${c.cost} · ${c.desc}</span></p>`}).join(''))}
function showRecord(){modal('탐색 기록',`<p>현재 층: ${S.floor}</p><p>완료 시즌: ${Math.min(5,S.season-1)} / 5</p><p>이번 시즌 턴: ${S.turn} / ${S.seasonLength}</p><div class="log">${S.seasonLog.slice(-25).join('\n')}</div>`)}
function modal(title,body){$('#modalbody').innerHTML=`<h2>${title}</h2>${body}<button onclick="document.querySelector('#modal').classList.add('hide')">닫기</button>`;$('#modal').classList.remove('hide')}
function resetAsk(){modal('기록 초기화',`<p>저장된 진행 상황을 지우고 처음부터 시작할까요?</p><button onclick="localStorage.removeItem('sizifSaveV04');S=fresh();render();document.querySelector('#modal').classList.add('hide')">초기화하기</button>`)}
render();
</script></body></html>
